# SDKMAN! —— get.sdkman.io 官方安装器（官网首屏一行：curl -s "https://get.sdkman.io" | bash）
# 注意：sdk 是 shell 函数（装后开新终端，或 source ~/.sdkman/bin/sdkman-init.sh），
# 不在 PATH 上，故不用 BINARIES，用 CHECK_FILES 查 init 脚本标志。
DESC="Java 工具链管理器（sdk 装 JDK/Maven/Gradle；装后由 sdk 自身管理）"
CATEGORY="language"
SCRIPT_URL="https://get.sdkman.io"
PREREQS="zip unzip"
CHECK_FILES="$HOME/.sdkman/bin/sdkman-init.sh"
