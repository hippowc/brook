# 代理预设：名字|模式|参数
#   prefix:  名字|prefix|https://代理地址/     （完整 URL 前拼接，gh-proxy 系通用）
#   replace: 名字|replace|github.com|镜像域名   （域名替换）
# 实测（2026-08-20，阿里云北京）：直连 ~83KB/s；
#   gh-proxy.com ~1.9MB/s ✓ 最快；ghfast.top ~1.4MB/s ✓；
#   ghproxy.net 无加速效果、kkgithub 不可达，均已剔除。
gh-proxy|prefix|https://gh-proxy.com/
ghfast|prefix|https://ghfast.top/
