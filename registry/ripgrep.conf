# ripgrep —— 资产命名：ripgrep-<tag>-<triple>.tar.gz（tag 无 v 前缀）
DESC="极速文本搜索工具（rg）"
REPO="BurntSushi/ripgrep"
ASSET="ripgrep-{{TAG}}-{{TARGET}}.tar.gz"
TARGET_linux_x86_64="x86_64-unknown-linux-musl"
