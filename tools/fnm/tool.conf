# fnm —— Node 版本管理器
# 资产命名实测（2026-08-24）：只有 fnm-linux.zip / fnm-macos.zip 两个包，
# macos 为通用二进制；无 linux arm64 资产。
DESC="Node 版本管理器：安装/切换官方 node（快速、跨 shell）"
CATEGORY="language"
REPO="Schniz/fnm"
ASSET="{{TARGET}}"
TARGET_linux_x86_64="fnm-linux.zip"
TARGET_macos_x86_64="fnm-macos.zip"
TARGET_macos_arm64="fnm-macos.zip"
ARCHIVE="zip"
BINARIES="fnm"
CHECKSUM="none"
NOTE_linux_arm64="上游只提供 fnm-linux.zip（x86_64），无 linux arm64 资产"
