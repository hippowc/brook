# shadowsocks-rust —— 资产命名实测（2026-08-19）：shadowsocks-<tag>.<triple>.tar.xz（附 .sha256）
DESC="高性能 SOCKS5 代理（ssserver/sslocal）"
REPO="shadowsocks/shadowsocks-rust"
ASSET="shadowsocks-{{TAG}}.{{TARGET}}.tar.xz"
TARGET_linux_x86_64="x86_64-unknown-linux-musl"
TARGET_linux_arm64="aarch64-unknown-linux-musl"
TARGET_macos_x86_64="x86_64-apple-darwin"
TARGET_macos_arm64="aarch64-apple-darwin"
ARCHIVE="tar.xz"
BINARIES="ssserver sslocal"
CHECKSUM="sha256-sidecar"
# 兜底候选（实测存在）：linux 的 gnu 三元组变体（错平台的候选会 404 自动跳过）
ASSET_FALLBACKS="shadowsocks-{{TAG}}.x86_64-unknown-linux-gnu.tar.xz shadowsocks-{{TAG}}.aarch64-unknown-linux-gnu.tar.xz"
